<script>






    // a) Take three subject names
    var subject1 = prompt("Enter first subject name:");
    var subject2 = prompt("Enter second subject name:");
    var subject3 = prompt("Enter third subject name:");

    // b) Total marks for each subject
    var totalMarksPerSubject = 100;

    // c) Take obtained marks for first subject
    var marks1 = Number(prompt("Enter obtained marks for " + subject1 + ":"));

    // d) Take obtained marks for remaining subjects
    var marks2 = Number(prompt("Enter obtained marks for " + subject2 + ":"));
    var marks3 = Number(prompt("Enter obtained marks for " + subject3 + ":"));

    // e) Calculate totals and percentage
    var totalObtainedMarks = marks1 + marks2 + marks3;
    var totalMarks = totalMarksPerSubject * 3;
    var percentage = (totalObtainedMarks / totalMarks) * 100;

    
    // Display result in browser
    document.write("<h2>Marks Sheet</h2>");
    document.write("<table border='1' cellpadding='10'>");
    document.write("<tr><th>Subject</th><th>Total Marks</th><th>Obtained Marks</th></tr>");

    document.write("<tr><td>" + subject1 + "</td><td>100</td><td>" + marks1 + "</td></tr>");
    document.write("<tr><td>" + subject2 + "</td><td>100</td><td>" + marks2 + "</td></tr>");
    document.write("<tr><td>" + subject3 + "</td><td>100</td><td>" + marks3 + "</td></tr>");

    document.write("<tr><th>Total</th><th>" + totalMarks + "</th><th>" + totalObtainedMarks + "</th></tr>");
    document.write("</table>");

    document.write("<h3>Percentage: " + percentage.toFixed(2) + "%</h3>");

</script>


</body>
